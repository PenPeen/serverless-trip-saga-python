name: Infra Lint

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'serverless_trip_saga_stack.py'
      - 'app.py'
      - 'cdk.json'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'infra/**'
      - 'serverless_trip_saga_stack.py'
      - 'app.py'
      - 'cdk.json'
      - 'pyproject.toml'

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk
      - name: Synthesize CDK templates
        run: uv run cdk synth --quiet
      - name: Run cfn-lint
        run: uv run cfn-lint
